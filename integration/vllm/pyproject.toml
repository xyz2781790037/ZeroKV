[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerokv-vllm"
version = "0.1.0"
description = "ZeroKV external prefix-cache connector for vLLM"
requires-python = ">=3.10"
dependencies = ["vllm==0.14.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zerokv_vllm*"]
